<ion-content class="registro-content">
  <div class="registro-container">
    <div class="registro-header">
      <img src="assets/LOGO1.png" alt="Logo" class="logo">
      <h1>Crear Cuenta</h1>
      <p class="subtitle">Únete a nuestra comunidad</p>
    </div>

    <form class="registro-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input
          type="text"
          id="nombre"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Ingresa tu nombre completo"
          class="form-input"
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="alias">Alias (nombre de usuario)</label>
        <input
          type="text"
          id="alias"
          [(ngModel)]="alias"
          name="alias"
          placeholder="Ingresa tu alias (solo letras, números y _)"
          class="form-input"
          autocomplete="username"
          (ngModelChange)="onAliasChange()"
          [class.input-error]="aliasDisponible === false"
          [class.input-success]="aliasDisponible === true"
        >
        <div class="alias-feedback">
          <span *ngIf="verificandoAlias" class="verificando">
            <ion-spinner name="dots"></ion-spinner> Verificando...
          </span>
          <span *ngIf="!verificandoAlias && aliasDisponible === true" class="disponible">
            ✓ Alias disponible
          </span>
          <span *ngIf="!verificandoAlias && aliasDisponible === false" class="no-disponible">
            ✗ Este alias ya está en uso
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Ingresa tu correo electrónico"
          class="form-input"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Ingresa tu contraseña (mínimo 6 caracteres)"
          class="form-input"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirma tu contraseña"
          class="form-input"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="autorizacion"
            name="autorizacion"
            class="checkbox-input"
          >
          <span class="checkbox-text">
            Acepto recibir promociones y ofertas especiales por correo electrónico
          </span>
        </label>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-primary" (click)="onRegister()">
          Registrarse
        </button>

        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          Cancelar
        </button>
      </div>

      <div class="login-link">
        <p>¿Ya tienes cuenta? <a (click)="goToLogin()">Inicia sesión aquí</a></p>
      </div>
    </form>
  </div>
</ion-content>
