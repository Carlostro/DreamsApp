

<div class="loading-container">
  <img src="/assets/icon/loading.gif" alt="Ícono" class="icon">
  @if (!showButtons) {
    <div class="loading-text">
      Cargando<span class="loading-dots"></span>
    </div>
  }

  <!--
  <div class="gps-button-container" *ngIf="!showButtons && showActivateGpsButton">
    <button class="action-button continue-button gps-button" (click)="onActivateGps()" [disabled]="checkingLocation">
      {{ checkingLocation ? 'Comprobando ubicación...' : 'Activar ubicación' }}
    </button>
  </div>
  -->



  <!-- Botones que aparecen después de verificar la ubicación -->
  @if (showButtons) {
    <div class="buttons-container">
      <button class="action-button login-button" (click)="onLogin()">
        Iniciar Sesión
      </button>
      <button class="action-button register-button" (click)="onRegister()">
        Registrarse
      </button>
      <button class="action-button continue-button" (click)="onContinueWithoutRegister()">
        Continuar sin registrar
      </button>
    </div>
  }
</div>
