<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Canjea tus Puntos</ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-title class="puntos-disponibles">
      <ion-icon name="trophy"></ion-icon>
      Tienes: {{ puntosDisponibles }} puntos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let promo of promosPuntos; trackBy: trackByFn" style="margin-bottom: 15px;" class="promo-item">
      <ion-img [src]="promo.Imagen" class="promo-img" loading="lazy"></ion-img>
      <ion-label>
        <div class="promo-label">{{ promo.Nombre }}</div>
        <div class="promo-description">{{ promo.Descripcion }}</div>
        <div class="promo-puntos">{{ promo.PuntosNecesarios }} puntos</div>
        <ion-button expand="block" (click)="canjearPuntos(promo)" class="canjear-button">Canjear</ion-button>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" [routerLink]="['/', timestamp, code, 'heladeria']">
      Volver a Inicio
    </ion-button>
  </ion-toolbar>
  <ion-toolbar *ngIf="cartItems > 0">
    <ion-button expand="block" [routerLink]="['/', timestamp, code, 'lista-pedido']">
      <ion-icon name="cart-outline" slot="start"></ion-icon>
      Ver Pedido ({{ cartItems }})
    </ion-button>
  </ion-toolbar>
</ion-footer>
