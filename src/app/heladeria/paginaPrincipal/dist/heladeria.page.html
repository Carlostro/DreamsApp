<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <img src="assets/Dreams1.jpg" class="header-image">
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="image-container">
    <img src="assets/Dreams.jpg" class="content-image">
  </div>
  <div class="button-container">
    <ion-button expand="block" [routerLink]="productRoute" color="light">Carta y Pedidos</ion-button>

    <!-- Botón de Promociones -->
    <ion-button expand="block" [routerLink]="promosRoute" color="light">
      <ion-icon name="star" slot="start" style="font-size: 28px; margin-right: 15px;"></ion-icon>
      Promociones
    </ion-button>

    <!-- Botón de Canjear Puntos (solo para usuarios registrados) -->
    <ion-button *ngIf="isRegisteredUser" expand="block" [routerLink]="promoPuntosRoute" color="light">
      <ion-icon name="trophy" slot="start" style="font-size: 28px; margin-right: 15px;"></ion-icon>
      Canjear Puntos
    </ion-button>

    <!-- Botón de Mis Pedidos (solo para usuarios registrados) -->
    <ion-button *ngIf="isRegisteredUser" expand="block" [routerLink]="misPedidosRoute" color="light">
      <ion-icon name="receipt-outline" slot="start" style="font-size: 28px; margin-right: 15px;"></ion-icon>
      Mis Pedidos
    </ion-button>
  </div>
<ion-footer>
  <app-navigation-buttons [activePage]="'heladeria'"></app-navigation-buttons>
</ion-footer>
